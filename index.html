<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Invest & co.</title>

  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/feature-polish.css">
</head>

<body>

<div class="container">

  <h1>Invest & co.</h1>

  <div id="setup">
    <label>Players:
      <select id="playerCount">
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
      </select>
    </label>

    <div id="playerNamesContainer"></div>

    <label>Game Mode:
      <select id="gameMode">
        <option value="turns">Turns</option>
        <option value="money">Target Money</option>
      </select>
    </label>

    <input id="modeValue" placeholder="Enter value (e.g. 20 or 5000)" inputmode="decimal" />

    <button id="startBtn" type="button">Start Game</button>
  </div>

  <div id="game" class="hidden">

    <div id="infoBar"></div>

    <div class="tradeToggle" id="buySellToggle"></div>

    <div class="buttons">
      <button type="button" onclick="endTurn()">End Turn</button>
      <button type="button" class="danger" onclick="confirmEndGame()">End Game</button>
      <button id="viewDividendsBtn" type="button" onclick="viewLastDividends()">View Last Dividends</button>
    </div>

    <div class="table-wrap">
      <table id="stockTable">
        <thead>
          <tr>
            <th>Company</th>
            <th>Price</th>
            <th>Change</th>
            <th>Owned</th>
            <th>Trade</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

  </div>

  <div id="podium" class="hidden">
    <div id="celebrationContainer">
      <div class="podiumBlock" id="firstPlace"></div>
      <div class="podiumBlock" id="secondPlace"></div>
      <div class="podiumBlock" id="thirdPlace"></div>
    </div>

    <button type="button" onclick="resetPodium()">Back to Menu</button>
    <div id="gameStats"></div>
  </div>

</div>

<div id="popup" class="hidden">
  <div id="popupContent"></div>
</div>

<script src="js/gameLogic.js"></script>
<script src="js/ui.js"></script>
<script src="js/animations.js"></script>
<script src="js/main.js"></script>
<script src="js/gameFeatures.js"></script>
<script src="js/featurePolish.js"></script>
<script src="js/feature-refresh.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    const startButton = document.getElementById("startBtn");
    if (!startButton) return;
    startButton.addEventListener("click", () => {
      window.setTimeout(() => {
        if (players.length) {
          resetFeatureState();
          setInitialFeatureStats();
          renderFeaturePanels();
          clearSavedGame();
          if (typeof window.__investFeaturePolishInit === "function") window.__investFeaturePolishInit();
        }
      }, 0);
    });
  }, { once: true });
</script>

</body>
</html>
